{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<h1>Edit Profile</h1>

{% if success %}
<div class="alert-success">{{ success }}</div>
{% endif %}
{% if error %}
<div class="alert-error">{{ error }}</div>
{% endif %}

<div class="edit-grid">
    <div class="edit-card">
        <h2>Profile Information</h2>
        <form method="post" action="/profile/edit" class="auth-form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ profile.username }}" required minlength="3">

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" value="{{ profile.phone or '' }}">

            <label for="dept">Department</label>
            <select id="dept" name="dept" required>
                {% for d in departments %}
                <option value="{{ d }}" {% if d == profile.dept %}selected{% endif %}>{{ d }}</option>
                {% endfor %}
            </select>

            <button type="submit">Save Changes</button>
        </form>
    </div>

    <div class="edit-card">
        <h2>Change Password</h2>
        <form method="post" action="/profile/change_password" class="auth-form">
            <label for="current_password">Current Password</label>
            <input type="password" id="current_password" name="current_password" required>

            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" placeholder="At least 6 characters" required minlength="6">

            <label for="confirm_new_password">Confirm New Password</label>
            <input type="password" id="confirm_new_password" name="confirm_new_password" required minlength="6">

            <button type="submit">Change Password</button>
        </form>
    </div>
</div>
{% endblock %}
