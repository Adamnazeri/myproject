{% extends "base.html" %}
{% block title %}Live Camera{% endblock %}
{% block content %}
<h1>📷 Live Camera</h1>

<button id="startBtn" onclick="startCamera()">▶️ Start Camera</button>
<button id="stopBtn" onclick="stopCamera()">⏹️ Stop Camera</button>

<br><br>
<select id="filterSelect" onchange="updateFeed()">
    <option value="none">No Filter</option>
    <option value="grayscale">Grayscale</option>
    <option value="sepia">Sepia</option>
    <option value="cartoon">Cartoon</option>
    <option value="invert">Invert</option>
    <option value="blur">Blur</option>
    <option value="yolo">Object Detection (AI)</option>
</select>

<br><br>
<img id="camFeed" src="" width="500">

<script>
    async function startCamera() {
        await fetch("/camera/start", { method: "POST" });
        updateFeed();
    }

    async function stopCamera() {
        await fetch("/camera/stop", { method: "POST" });
        document.getElementById('camFeed').src = "";
    }

    function updateFeed() {
        const filter = document.getElementById('filterSelect').value;
        document.getElementById('camFeed').src = "/video_feed?filter_type=" + filter + "&t=" + Date.now();
    }
</script>
{% endblock %}
